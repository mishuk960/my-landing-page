<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Landing Page</title>

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="assets/style.css">
</head>

<body>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">

      <h1 id="site-title">Discover Something Amazing</h1>

      <p>
        Explore our featured offers and find the option
        that works best for you.
      </p>

      <a href="#offers" class="cta-button">
        VIEW OFFERS
      </a>

    </div>
  </section>


  <!-- Offers Section -->
  <section class="section" id="offers">

    <div class="container">

      <h2>Featured Offers</h2>

      <div class="offer-grid">

        <!-- Offer 1 -->
        <div class="offer-card">

          <h2 id="offer1-name">Offer 1</h2>

          <p id="offer1-description">
            Discover this special offer.
          </p>

          <a
            id="offer1-button"
            href="#"
            class="cta-button"
            data-affiliate="offer1"
            target="_blank"
            rel="noopener noreferrer"
          >
            Get Offer
          </a>

        </div>


        <!-- Offer 2 -->
        <div class="offer-card">

          <h2 id="offer2-name">Offer 2</h2>

          <p id="offer2-description">
            Check out this offer.
          </p>

          <a
            id="offer2-button"
            href="#"
            class="cta-button"
            data-affiliate="offer2"
            target="_blank"
            rel="noopener noreferrer"
          >
            Get Offer
          </a>

        </div>


        <!-- Offer 3 -->
        <div class="offer-card">

          <h2 id="offer3-name">Offer 3</h2>

          <p id="offer3-description">
            Explore this offer.
          </p>

          <a
            id="offer3-button"
            href="#"
            class="cta-button"
            data-affiliate="offer3"
            target="_blank"
            rel="noopener noreferrer"
          >
            Get Offer
          </a>

        </div>

      </div>

    </div>

  </section>


  <!-- Footer -->
  <footer>
    <p>
      © 2026 <span id="footer-name">My Landing Page</span>
    </p>
  </footer>


  <!-- Configuration -->
  <script src="config.js"></script>

  <!-- Tracking -->
  <script src="tracking.js"></script>


  <!-- Page Logic -->
  <script>

    // Site name
    document.getElementById("site-title").textContent =
      AFFILIATE_CONFIG.siteName;

    document.getElementById("footer-name").textContent =
      AFFILIATE_CONFIG.siteName;


    // Offer 1
    document.getElementById("offer1-name").textContent =
      AFFILIATE_CONFIG.offers.offer1.name;

    document.getElementById("offer1-description").textContent =
      AFFILIATE_CONFIG.offers.offer1.description;

    document.getElementById("offer1-button").textContent =
      AFFILIATE_CONFIG.offers.offer1.buttonText;

    document.getElementById("offer1-button").href =
      AFFILIATE_CONFIG.offers.offer1.url;


    // Offer 2
    document.getElementById("offer2-name").textContent =
      AFFILIATE_CONFIG.offers.offer2.name;

    document.getElementById("offer2-description").textContent =
      AFFILIATE_CONFIG.offers.offer2.description;

    document.getElementById("offer2-button").textContent =
      AFFILIATE_CONFIG.offers.offer2.buttonText;

    document.getElementById("offer2-button").href =
      AFFILIATE_CONFIG.offers.offer2.url;


    // Offer 3
    document.getElementById("offer3-name").textContent =
      AFFILIATE_CONFIG.offers.offer3.name;

    document.getElementById("offer3-description").textContent =
      AFFILIATE_CONFIG.offers.offer3.description;

    document.getElementById("offer3-button").textContent =
      AFFILIATE_CONFIG.offers.offer3.buttonText;

    document.getElementById("offer3-button").href =
      AFFILIATE_CONFIG.offers.offer3.url;

  </script>

</body>
</html>
