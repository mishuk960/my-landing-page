<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Landing Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            background: white;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            color: #666;
            max-width: 650px;
            margin: auto;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 16px 35px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .section {
            padding: 50px 20px;
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 30px;
            width: 280px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #111827;
            color: white;
        }
    </style>
</head>

<body>

    <section class="hero">
        <h1>Discover Something Amazing</h1>

        <p>
            Get access to our exclusive offer today.
            Simple, fast and completely easy to use.
        </p>

        <a href="#" class="button">GET STARTED</a>
    </section>


    <section class="section">

        <h2>Why Choose Us?</h2>

        <div class="cards">

            <div class="card">
                <h3>Easy</h3>
                <p>Simple and easy-to-use experience.</p>
            </div>

            <div class="card">
                <h3>Fast</h3>
                <p>Quick access from any device.</p>
            </div>

            <div class="card">
                <h3>Free</h3>
                <p>Start today without complicated setup.</p>
            </div>

        </div>

    </section>


    <footer>
        © 2026 My Landing Page
    </footer>

</body>
</html>
